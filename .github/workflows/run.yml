name: run
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: kyotei
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-gh.txt || pip install numpy lightgbm scipy lhafile
      - run: npm ci
      - run: npm run build
      - run: VITE_STATIC=1 npx vite build --outDir /tmp/site --emptyOutDir
      - run: bash scripts/gh/loop.sh
